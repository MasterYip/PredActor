# PredActor artifact synchronization map.
#
# local_path is resolved relative to the public Git repository root. The
# default layout keeps learned weights in the Git-ignored Artifacts directory.

repo_id: MasterYip/PredActor_Artifacts
repo_type: model
endpoint: https://huggingface.co
private: false

entries:
  - hf_path: assets
    local_path: Artifacts/assets
    kind: directory
    enabled: true
    notes: Model-card banner, overview, logos, and institutional marks
    files:
      institution-strip.svg:
        size_bytes: 729397
        sha256: 7323b48524194780143ae01b964411dad53232f3a0b4d0565ecdb02f7f21b2ed
      predactor-icon-on-dark.svg:
        size_bytes: 1947
        sha256: 2d7b37863d7e523a3b720a7a110775db0e89a7441126363390cd428b0dc4837b
      predactor-icon-on-light.svg:
        size_bytes: 1947
        sha256: 9799555370986c05405dccd6f65eaf5f8181e1ca9200e299cb0fc8c9bf409a14
      predactor-preview.png:
        size_bytes: 2551014
        sha256: 6d9f0b631c1e902141479d053147553e5a0b6af4244234b79d7e12e4191d2767
      predactor-readme-banner.svg:
        size_bytes: 7348
        sha256: 925b6ac02811a1c49f5e7b31bc9a27b225fc8057b0f390d9481f92fc7e2295f1
      predactor-wordmark-on-dark.svg:
        size_bytes: 2905
        sha256: f8432dac695634c584c24adb505272fdc5f54ec1b069124896f94e6bcfbb6558
      predactor-wordmark-on-light.svg:
        size_bytes: 2904
        sha256: e52fe30f0540d171cff8ef4054547bacb3144054b8219c6c5b0b3d4125b35a46

  - hf_path: README.md
    local_path: Artifacts/README.md
    kind: file
    enabled: true
    notes: Hugging Face model card

  - hf_path: SHA256SUMS
    local_path: Artifacts/SHA256SUMS
    kind: file
    enabled: true
    notes: Published artifact checksums

  - hf_path: checkpoints/predactor/pdp051
    local_path: Artifacts/checkpoints/predactor/pdp051
    kind: directory
    enabled: true
    notes: PredActor PDP051 text-conditioned policy checkpoint
    files:
      latest.ckpt:
        size_bytes: 49212894
        sha256: 2d963b32786f2989c6472726df9fcfe6b385590127e12e1f549a4b7d77488b2e

  - hf_path: checkpoints/motionclip/g1-model-xyz-clip
    local_path: Artifacts/checkpoints/motionclip/g1-model-xyz-clip
    kind: directory
    enabled: true
    notes: Fine-tuned G1 MotionCLIP checkpoint
    files:
      checkpoint_0100.pth.tar:
        size_bytes: 542749069
        sha256: 66a127df4958b346089b2020f2705c7456d9db0ee8b4bd9518608b708b35fc3c

  - hf_path: dataset
    local_path: Artifacts/dataset
    kind: directory
    enabled: true
    notes: Reserved for future public datasets
