# prdp_wbg_ddim_example.yaml
# ==========================
# Example deploy config: PRDP (unconditioned g1prdp_diffuse) with Whole-Body
# Guidance running on a DDIM path.
#
# WBG is supported on EVERY sampler mode (Gap 1). Choose ONE of:
#
#   rolling_ddpm   ddim_steps: 0   rolling DDPM (original WBG path)
#   scalar_ddim    ddim_steps: 5   uniform-t scalar DDIM (fast path, option c)
#   ns_ddim        ddim_steps: 5   per-position NS DDIM  (option a)
#   rolling_ddim   ddim_steps: 20  per-position rolling DDIM (option b)
#
# ns_ddim requires `use_ns_ddim: true`; rolling_ddim requires
# `randomize_noise_schedule: true`. rolling_ddim needs ddim_steps >=
# denoising_steps (no row subsampling) so the warm-start rolling buffer stays
# full-length across control ticks.
#
# The `runner:` block below also enables the interactive WBG UDP receiver
# (port 9879) so wbg_guidance_sender.py can drive enabled/command/kp live.
# WBG still requires env.use_fk=true and a real urdf_path.
#
# REGENERATION (for a deploy config produced by export_policy.py):
#   export_policy.py serializes model.whole_body_guidance ONLY when the source
#   actor has a whole_body_guidance_config. A checkpoint whose embedded cfg lacks
#   one (e.g. g1prdp_diffuse runs trained without WBG) will silently omit the
#   block. Pass the standalone actor config to attach WBG to such a checkpoint:
#     python tools/export_policy.py --checkpoint <ckpt> --config checkpoint \
#       --output models/prdp --mode backbone --obs-profile G1 --use-fk \
#       --urdf-path <g1/main.urdf> --wbg-config config/prdp_wbg_actor_config.yaml

model:
  backend: torch
  actor_type: prdp
  path: /absolute/path/to/g1_policy_backbone.pt
  schedule_path: /absolute/path/to/ddpm_schedule.pt
  emphasis_path: /absolute/path/to/emphasis_matrices.pt
  obs_dim: 192
  action_dim: 29
  n_obs_steps: 4
  n_future_steps: 16
  denoising_steps: 20
  obs_profile: G1
  n_cond_steps: 4
  no_state_override: false
  has_motion_cond: true
  motion_dim: 96
  backbone_cond_dim: 96
  ddim_eta: 0.0
  sampler_mode: scalar_ddim
  ddim_steps: 5
  action_schedule: from_xT_decreasing
  state_schedule: from_xT_step
  whole_body_guidance:
    enabled: true
    mode: classifier
    trajectory_mode: simple
    dt: 0.02
    enable_zeta_comp: false     # false: legacy single-level zeta for DDIM jumps
    enable_damping_comp: false  # false: legacy projected-gradient damping
    vx: {enabled: true,  command: 0.3, kp: 0.1, body_indices: [0, 3, 4, 5, 6, 7, 8, 9]}
    vy: {enabled: false, command: 0.0, kp: 0.1, body_indices: [0, 3, 4, 5, 6, 7, 8, 9]}
    wz: {enabled: false, command: 0.0, kp: 0.1, body_indices: [0, 3, 4, 5, 6, 7, 8, 9]}

env:
  control_dt: 0.02
  network_interface: lo
  use_fk: true
  urdf_path: /absolute/path/to/g1/main.urdf

