# Safety FSM Configuration
#
# Matches the reference style from temp/deploy/robots/g1_29dof/config/config.yaml.
# Load with:  ./run_g1_robot --fsm-config config/fsm_config.yaml
#
# Button trigger strings:
#   <Button>.<event>  where event = on_pressed | pressed | on_released
#   Button names: A, B, X, Y, LB, RB, BACK, START, GUIDE, LS, RS
#
# State types:
#   (omitted)  = normal state — uses state's kp/kd, sends target joint positions
#   "policy"   = diffusion policy runs — should_run_policy() returns true

# Optional per-step deployment trace. The path is relative to this FSM file;
# --record-csv PATH enables recording and overrides only the path.
record_csv:
  enabled: false
  path: eval_output/deploy_trace.csv
  fields:
    metadata: true
    command: true
    condition: false
    policy_obs: false
    robot_obs: [joint_pos, joint_vel, projected_gravity, base_ang_vel, last_actions]
    action: true

FSM:
  # Enabled states (order matters: first = initial state on startup)
  _:
    Passive:
      id: 1
    Ready:
      id: 2
    Running:
      id: 3
      type: policy

  # ---- Passive: limp / safe mode ----
  # No kp → motor commands send kp=0, robot is limp.
  # This is also the safety fallback state (entered on fall detection).
  Passive:
    transitions:
      Ready: RB.on_pressed
    # Low damping only (kp=0 by default)
    kd: [
      3, 3, 3, 3, 3, 3,
      3, 3, 3, 3, 3, 3,
      3, 3, 3,
      3, 3, 3, 3, 3, 3, 3,
      3, 3, 3, 3, 3, 3, 3,
    ]

  # ---- Ready: stand pose, active PD, waiting for run command ----
  Ready:
    transitions:
      Passive: B.on_pressed # circle
      Running: X.on_pressed # delta
    # Stand stiffness (MuJoCo SDK joint order)
    kp: [
      100, 100, 100, 150,  40,  40,
      100, 100, 100, 150,  40,  40,
      200, 200, 200,
       40,  40,  40,  40,  40,  40,  40,
       40,  40,  40,  40,  40,  40,  40,
    ]
    kd: [
      2, 2, 2, 4, 2, 2,
      2, 2, 2, 4, 2, 2,
      5, 5, 5,
      10, 10, 10, 10, 10, 10, 10,
      10, 10, 10, 10, 10, 10, 10,
    ]
    # Smooth interpolation to stand pose over 2 seconds.
    # qs[0] = [] means "capture current joint positions at state entry".
    # qs[1] = target stand pose (MuJoCo SDK joint order, 29 DOF).
    # The deploy_fsm loader auto-converts from MuJoCo → IsaacLab order at load time.
    ts: [0, 2.0]
    qs: # IMPORTANT: Ensure PR mode for ankle
      - []  # capture current at entry
      # MuJoCo joint order:
      #   left_leg[6]:  hip_pitch, hip_roll, hip_yaw, knee, ankle_pitch, ankle_roll
      #   right_leg[6]: hip_pitch, hip_roll, hip_yaw, knee, ankle_pitch, ankle_roll
      #   waist[3]:     yaw, roll, pitch
      #   left_arm[7]:  shoulder_pitch, shoulder_roll, shoulder_yaw, elbow, wrist_roll, wrist_pitch, wrist_yaw
      #   right_arm[7]: shoulder_pitch, shoulder_roll, shoulder_yaw, elbow, wrist_roll, wrist_pitch, wrist_yaw
      - [
          -0.312, 0, 0, 0.669, -0.363, 0,
          -0.312, 0, 0, 0.669, -0.363, 0,
          0, 0, 0,
          0.2, 0.2, 0, 0.6, 0, 0, 0,
          0.2, -0.2, 0, 0.6, 0, 0, 0,
        ]

  # ---- Running: diffusion policy active ----
  # Kp/Kd are now managed here (moved from the deploy config env section).
  # These are the policy-trained gains; applied via FSM gain override on entry.
  Running:
    transitions:
      Passive: B.on_pressed
    # Policy-running stiffness (MuJoCo SDK joint order, 29 DOF)
    kp: [
      40.17923847137318, 99.09842777666113, 40.17923847137318, 99.09842777666113,
      28.50124619574858, 28.50124619574858, 40.17923847137318, 99.09842777666113, 40.17923847137318,
      99.09842777666113, 28.50124619574858, 28.50124619574858, 40.17923847137318, 28.50124619574858,
      28.50124619574858, 14.25062309787429, 14.25062309787429, 14.25062309787429, 14.25062309787429,
      14.25062309787429, 16.77832748089279, 16.77832748089279, 14.25062309787429, 14.25062309787429,
      14.25062309787429, 14.25062309787429, 14.25062309787429, 16.77832748089279, 16.77832748089279
    ]
    kd: [
      2.5578897650279457, 6.3088018534966395, 2.5578897650279457, 6.3088018534966395,
      1.814445686584846, 1.814445686584846, 2.5578897650279457, 6.3088018534966395,
      2.5578897650279457, 6.3088018534966395, 1.814445686584846, 1.814445686584846,
      2.5578897650279457, 1.814445686584846, 1.814445686584846, 0.907222843292423, 0.907222843292423,
      0.907222843292423, 0.907222843292423, 0.907222843292423, 1.06814150219, 1.06814150219,
      0.907222843292423, 0.907222843292423, 0.907222843292423, 0.907222843292423, 0.907222843292423,
      1.06814150219, 1.06814150219
    ]

  # ---- Runtime safety settings ----
  bad_orientation_limit_deg: 60.0   # ~1 rad
  auto_passive_on_fall: true

  # Joystick configuration
  # Omit or set to "" / "null" → external mode (Unitree wireless remote from DDS lowstate)
  # Set to "/dev/input/js0"    → local wired gamepad
  joystick_device: ""                   # "" = Unitree wireless remote, "/dev/input/js0" = local
  joystick_mapping: "xbox"             # controller type (only for local gamepad): xbox | ps5

  # Per-joint torque limits [N·m] (MuJoCo SDK joint order, 29 DOF).
  # Any joint exceeding its limit → immediate fallback to Passive.
  # Set a limit to 0 to disable checking for that joint.
  # Uncomment to enable (empty = torque protection disabled).
  #
  # Joint order (MuJoCo):
  #   left_leg[6]: hip_pitch, hip_roll, hip_yaw, knee, ankle_pitch, ankle_roll
  #   right_leg[6]: hip_pitch, hip_roll, hip_yaw, knee, ankle_pitch, ankle_roll
  #   waist[3]: yaw, roll, pitch
  #   left_arm[7]: shoulder_pitch, shoulder_roll, shoulder_yaw, elbow,
  #                wrist_roll, wrist_pitch, wrist_yaw
  #   right_arm[7]: shoulder_pitch, shoulder_roll, shoulder_yaw, elbow,
  #                 wrist_roll, wrist_pitch, wrist_yaw
  #
  # torque_limits: [
  #   # left leg
  #   120, 80, 80, 120, 60, 40,
  #   # right leg
  #   120, 80, 80, 120, 60, 40,
  #   # waist
  #   50, 50, 50,
  #   # left arm
  #   40, 40, 30, 40, 29, 29, 29,
  #   # right arm
  #   40, 40, 30, 40, 29, 29, 29,
  # ]
  torque_limits: [
    # left leg
    160, 160, 160, 160, 110, 80,
    # right leg
    160, 160, 160, 160, 110, 80,
    # waist
    80, 80, 80,
    # left arm
    40, 40, 30, 40, 29, 29, 29,
    # right arm
    40, 40, 30, 40, 29, 29, 29,
  ]
