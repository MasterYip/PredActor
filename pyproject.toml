[build-system]
requires = ["setuptools>=74"]
build-backend = "setuptools.build_meta"

[project]
name = "predactor-eval"
version = "0.1.0"
description = "Public MuJoCo evaluation runtime for PredActor"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "clip",
  "customtkinter==6.0.0",
  "diffusers==0.11.1",
  "dill==0.4.1",
  "einops==0.8.2",
  "fastapi==0.136.1",
  "huggingface-hub==0.23.0",
  "hydra-core==1.3.2",
  "matplotlib==3.10.8",
  "mujoco==3.5.0",
  "mujoco-python-viewer==0.1.4",
  "numba==0.63.1",
  "numpy==1.26.4",
  "omegaconf==2.3.0",
  "pandas==2.3.3",
  "pin==2.7.0",
  "psutil==5.9.8",
  "pytorch-kinematics==0.9.1",
  "scipy==1.15.3",
  "seaborn==0.13.2",
  "torch==2.5.1",
  "torchvision==0.20.1",
  "tqdm==4.67.3",
  "uvicorn[standard]==0.46.0",
  "wandb==0.26.1",
  "zarr==2.18.3",
]

[project.scripts]
predactor-eval = "cond_eval:main"

[tool.setuptools]
package-dir = {"" = "PredActor"}
py-modules = ["cond_eval"]

[tool.setuptools.packages.find]
where = ["PredActor"]
include = ["diffusion_policy*"]

[tool.uv.sources]
clip = { git = "https://github.com/openai/CLIP.git", rev = "dcba3cb2e2827b402d2701e7e1c7d9fed8a20ef1" }
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[tool.uv.extra-build-dependencies]
clip = ["setuptools==74.1.2"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
